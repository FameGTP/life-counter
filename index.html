<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>EDL Counter</title>
<meta name="theme-color" content="#0a0d13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EDL Counter">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
  :root{--vhu:1svh; --apph:100svh; --panel:#171c26; --panel2:#1e2534; --border:#2a3347; --text:#e7ecf5; --muted:#8b96ab; --accent:#f0b429; --danger:#ef4444; --success:#22c55e;}
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; height:100svh; height:var(--apph); overscroll-behavior:none;}
  body{background:#0a0d13; color:var(--text); font-family:'Segoe UI','Leelawadee UI','Noto Sans Thai',Tahoma,sans-serif; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;}
  .btn{background:var(--panel2); border:1px solid var(--border); color:var(--text); padding:8px 16px; border-radius:8px; font-size:14px; cursor:pointer; white-space:nowrap;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#1a1a0a; font-weight:700;}
  .btn.danger{border-color:#7f1d1d;}
  .cpanel{position:absolute; left:0; right:0; height:50%; overflow:hidden;}
  #cp2{top:0; transform:rotate(180deg); background:linear-gradient(180deg,#141a28,#0a0d13);}
  #cp1{bottom:0; background:linear-gradient(0deg,#141a28,#0a0d13);}
  #cdivider{position:absolute; top:50%; left:0; right:0; height:1px; transform:translateY(-.5px); background:linear-gradient(90deg, transparent, var(--border) 15%, var(--border) 85%, transparent); z-index:3; pointer-events:none;}
  .cinner{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; gap:1vh; gap:calc(1 * var(--vhu)); padding:max(38px, 7vh) 12px calc(12px + 2vh) 12px; padding:max(38px, calc(7 * var(--vhu))) 12px calc(12px + calc(2 * var(--vhu))) 12px;}
  .crow{display:flex; align-items:center; justify-content:center; gap:2.5vw; width:100%;}
  .crow .zl,.crow .zr{flex:1 1 0; display:flex; align-items:center; justify-content:center; gap:2vw; min-width:0;}
  .crow .zc{display:flex; align-items:center; justify-content:center; gap:3vw;}
  .chp{font-size:min(17vh,22vw); font-size:min(calc(17 * var(--vhu)),22vw); font-weight:900; line-height:1; min-width:2ch; text-align:center; font-variant-numeric:tabular-nums; margin:0 min(4.5vh,7vw); margin:0 min(calc(4.5 * var(--vhu)),7vw);}
  .chp.low{color:#ef4444;}
  .cbig{width:min(11vh,16vw); width:min(calc(11 * var(--vhu)),16vw); height:min(11vh,16vw); height:min(calc(11 * var(--vhu)),16vw); border-radius:50%; border:2px solid var(--border); background:var(--panel); color:var(--text); font-size:min(5vh,7vw); font-size:min(calc(5 * var(--vhu)),7vw); font-weight:800; cursor:pointer; flex-shrink:0;}
  .cbig.cminus:active{background:var(--danger); color:#fff; border-color:var(--danger);}
  .cbig.cplus:active{background:var(--success); color:#0a1a0f; border-color:var(--success);}
  .csmall{padding:6px 14px; border-radius:16px; border:1px solid var(--border); background:var(--panel); color:var(--muted); font-size:min(1.9vh,3.4vw); font-size:min(calc(1.9 * var(--vhu)),3.4vw); cursor:pointer; white-space:nowrap;}
  .csmall:active{border-color:var(--accent); color:var(--accent);}
  .clabel{font-size:min(1.8vh,3.2vw); font-size:min(calc(1.8 * var(--vhu)),3.2vw); color:var(--muted); letter-spacing:1px; font-weight:700;}
  .caether{display:flex; align-items:center; gap:4vw;}
  .cspark{width:min(9vh,14vw); width:min(calc(9 * var(--vhu)),14vw); height:min(9vh,14vw); height:min(calc(9 * var(--vhu)),14vw); border-radius:50%; border:2px solid var(--border); background:var(--panel); color:#576480; font-size:min(5vh,7.5vw); font-size:min(calc(5 * var(--vhu)),7.5vw); line-height:1; cursor:pointer; flex-shrink:0; transition:color .12s, border-color .12s, text-shadow .12s;}
  .cspark.lit{color:#7dd3fc; border-color:#7dd3fc; text-shadow:0 0 12px #38bdf8, 0 0 24px #0ea5e9;}
  .cspark:active{transform:scale(.92);}
  #cmid{position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); display:flex; justify-content:center; align-items:center; z-index:5; pointer-events:none;}
  .cmidActions{display:flex; align-items:center; gap:8px; max-width:0; overflow:hidden; opacity:0; margin-right:0; transition:max-width .22s ease, opacity .18s ease, margin-right .22s ease; pointer-events:none;}
  .cmidActions.open{max-width:400px; opacity:1; margin-right:8px; pointer-events:auto;}
  .cmidActions .btn{pointer-events:auto; box-shadow:0 2px 12px rgba(0,0,0,.5); white-space:nowrap;}
  .cmidToggle{pointer-events:auto; width:32px; height:32px; min-width:32px; border-radius:50%; border:1px solid var(--border); background:var(--panel2); color:var(--muted); font-size:17px; line-height:1; cursor:pointer; opacity:.4; box-shadow:0 2px 10px rgba(0,0,0,.45); transition:opacity .15s, background .15s, color .15s, border-color .15s;}
  .cmidToggle:active{opacity:1;}
  .cmidToggle.active{opacity:1; background:var(--accent); color:#1a1a0a; border-color:var(--accent);}
  #cfirstMsg{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:var(--accent); color:#1a1a0a; font-weight:900; font-size:min(3.5vh,6vw); font-size:min(calc(3.5 * var(--vhu)),6vw); padding:14px 30px; border-radius:30px; z-index:6; display:none; box-shadow:0 4px 24px rgba(0,0,0,.6);}
  .cname{position:absolute; top:max(8px, env(safe-area-inset-top)); left:12px; font-size:min(1.8vh,3.2vw); font-size:min(calc(1.8 * var(--vhu)),3.2vw); color:var(--muted); font-weight:700; letter-spacing:1px; z-index:4; transition:color .2s, background .2s;}
  /* ฝั่งที่เริ่มก่อน — ไฮไลต์ค้างไว้จนกว่าจะเริ่มเกมใหม่ */
  .cname{cursor:pointer;}
  .cname.first{color:var(--accent);}
  /* จานสีพื้นหลังของแต่ละฝั่ง */
  .cpick{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:none; z-index:8;
    background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:12px 14px;
    box-shadow:0 8px 30px rgba(0,0,0,.65); gap:10px; flex-wrap:wrap; justify-content:center; max-width:88%;}
  .cpick.show{display:flex;}
  .csw{width:min(5.6vh,8.5vw); width:min(calc(5.6 * var(--vhu)),8.5vw); height:min(5.6vh,8.5vw); height:min(calc(5.6 * var(--vhu)),8.5vw); border-radius:50%; border:2px solid var(--border);
    cursor:pointer; padding:0; flex-shrink:0;}
  .csw.on{border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,.3);}
  .csw:active{transform:scale(.9);}
  /* ตัวจับเวลา — วางชิดเส้นแบ่งกลางทั้งสองฝั่ง อ่านถูกด้านทั้งคู่ */
  .ctimer{position:absolute; top:max(8px, env(safe-area-inset-top)); right:12px; z-index:4;
    font-size:min(2.1vh,3.8vw); font-size:min(calc(2.1 * var(--vhu)),3.8vw); font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums;
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:3px 12px;
    cursor:pointer; letter-spacing:.5px; transition:color .2s, background .2s, border-color .2s;}
  .ctimer.run{color:var(--text); border-color:#3d4b66;}
  .ctimer.done{color:#fff; background:var(--danger); border-color:var(--danger); animation:tflash .8s steps(1,end) infinite;}
  @keyframes tflash{0%,49%{opacity:1;} 50%,100%{opacity:.2;}}
  .tpick{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); display:none; z-index:9;
    background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.7); gap:8px; flex-wrap:wrap; justify-content:center; max-width:90vw; width:290px;}
  .tpick.show{display:flex;}
  .tpick .thead{width:100%; text-align:center; font-size:12px; color:var(--muted); font-weight:700; letter-spacing:1px;}
  .tpick .btn{flex:1 1 28%;}
</style>
</head>
<body>
  <div class="cpanel" id="cp2">
    <span class="cname" id="cname2" onclick="togglePick(2)">PLAYER 2</span>
    <div class="cpick" id="cpick2"></div>
    <button class="ctimer" id="ctimer2" onclick="toggleTimer()">30:00</button>
    <div class="cinner">
      <div class="crow">
        <button class="csmall" onclick="resetHP(2)">↻ RESET LP</button>
        <button class="csmall" onclick="chgMax(2,-1)">Max −</button>
        <span class="clabel" id="cmax2">30</span>
        <button class="csmall" onclick="chgMax(2,1)">Max +</button>
      </div>
      <div class="crow">
        <button class="cbig cminus" onclick="chgHP(2,-1)">−</button>
        <span class="chp" id="chp2">30</span>
        <button class="cbig cplus" onclick="chgHP(2,1)">+</button>
      </div>
      <div class="crow">
        <span class="zl"><span class="clabel">AETHER</span></span>
        <span class="zc"><div class="caether">
          <button class="cspark" id="cae2_0" onclick="toggleAE(2,0)">✦</button>
          <button class="cspark" id="cae2_1" onclick="toggleAE(2,1)">✦</button>
          <button class="cspark" id="cae2_2" onclick="toggleAE(2,2)">✦</button>
        </div></span>
        <span class="zr"><button class="csmall" onclick="resetAE(2)">↻</button></span>
      </div>
    </div>
  </div>
  <div class="cpanel" id="cp1">
    <span class="cname" id="cname1" onclick="togglePick(1)">PLAYER 1</span>
    <div class="cpick" id="cpick1"></div>
    <button class="ctimer" id="ctimer1" onclick="toggleTimer()">30:00</button>
    <div class="cinner">
      <div class="crow">
        <button class="csmall" onclick="resetHP(1)">↻ RESET LP</button>
        <button class="csmall" onclick="chgMax(1,-1)">Max −</button>
        <span class="clabel" id="cmax1">30</span>
        <button class="csmall" onclick="chgMax(1,1)">Max +</button>
      </div>
      <div class="crow">
        <button class="cbig cminus" onclick="chgHP(1,-1)">−</button>
        <span class="chp" id="chp1">30</span>
        <button class="cbig cplus" onclick="chgHP(1,1)">+</button>
      </div>
      <div class="crow">
        <span class="zl"><span class="clabel">AETHER</span></span>
        <span class="zc"><div class="caether">
          <button class="cspark" id="cae1_0" onclick="toggleAE(1,0)">✦</button>
          <button class="cspark" id="cae1_1" onclick="toggleAE(1,1)">✦</button>
          <button class="cspark" id="cae1_2" onclick="toggleAE(1,2)">✦</button>
        </div></span>
        <span class="zr"><button class="csmall" onclick="resetAE(1)">↻</button></span>
      </div>
    </div>
  </div>
  <div id="cdivider"></div>
  <div id="cmid">
    <div class="cmidActions" id="cmidActions">
      <button class="btn primary" id="cfirstBtn" onclick="pickFirst(); closeMid();" title="สุ่มผู้เริ่มก่อน">🎲 FIRST!</button>
      <button class="btn" onclick="openTPick(); closeMid();" title="ตั้งเวลา">⏱</button>
      <button class="btn" id="cfsBtn" onclick="toggleFS(); closeMid();" title="เต็มจอ">⛶</button>
      <button class="btn" onclick="resetGame(); closeMid();" title="เริ่มใหม่">↻</button>
    </div>
    <button class="cmidToggle" id="cmidToggle" onclick="toggleMid()" title="เมนู">⋮</button>
  </div>
  <div id="cfirstMsg"></div>
  <div class="tpick" id="tpick">
    <div class="thead">ตั้งเวลาแข่ง (นาที)</div>
    <button class="btn" onclick="setTimer(20)">20</button>
    <button class="btn" onclick="setTimer(30)">30</button>
    <button class="btn" onclick="setTimer(40)">40</button>
    <button class="btn" onclick="setTimer(50)">50</button>
    <button class="btn" onclick="setTimer(60)">60</button>
    <button class="btn" onclick="setTimer(90)">90</button>
    <button class="btn danger" style="flex:1 1 100%" onclick="resetTimer()">↻ รีเซ็ตเวลา</button>
  </div>

<script>
const LS_CTR = 'eidolon_counter_v2';
let ctr = {hp1:30, hp2:30, max1:30, max2:30, ae1:[1,1,1], ae2:[1,1,1], first:0, col1:'', col2:'',
           tdur:30*60, tleft:30*60, trun:0, tend:0};
try{ const c = JSON.parse(localStorage.getItem(LS_CTR));
  if(c && typeof c.hp1==='number'){ ctr = c;
    if(!Array.isArray(ctr.ae1)) ctr.ae1 = [1,1,1];
    if(!Array.isArray(ctr.ae2)) ctr.ae2 = [1,1,1];
    if(typeof ctr.first !== 'number') ctr.first = 0;
    if(typeof ctr.col1 !== 'string') ctr.col1 = '';
    if(typeof ctr.col2 !== 'string') ctr.col2 = '';
    if(typeof ctr.tdur !== 'number') ctr.tdur = 30*60;
    if(typeof ctr.tleft !== 'number') ctr.tleft = ctr.tdur;
    if(typeof ctr.trun !== 'number') ctr.trun = 0;
    if(typeof ctr.tend !== 'number') ctr.tend = 0; } }catch(e){}

/* ---------- ตัวจับเวลานับถอยหลัง ----------
   ใช้เวลาสิ้นสุดจริง (tend) ตอนเดินอยู่ เวลาจะได้ไม่เพี้ยนแม้ปิดจอหรือรีโหลด */
function timerLeft(){
  if(ctr.trun && ctr.tend) return Math.max(0, Math.round((ctr.tend - Date.now())/1000));
  return Math.max(0, ctr.tleft);
}
function fmtTime(s){
  const m = Math.floor(s/60), r = s%60;
  return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;
}
function drawTimer(){
  const s = timerLeft(), txt = fmtTime(s);
  for(const p of [1,2]){
    const el = document.getElementById('ctimer'+p);
    if(!el) continue;
    el.textContent = txt;
    el.className = 'ctimer' + (s === 0 ? ' done' : (ctr.trun ? ' run' : ''));
  }
  if(ctr.trun && s === 0){ ctr.trun = 0; ctr.tend = 0; ctr.tleft = 0; saveCtr(); }
}
function toggleTimer(){
  const s = timerLeft();
  if(s === 0){ ctr.tleft = ctr.tdur; ctr.trun = 0; ctr.tend = 0; }        // หมดแล้ว กดอีกทีเพื่อตั้งใหม่
  else if(ctr.trun){ ctr.tleft = s; ctr.trun = 0; ctr.tend = 0; }          // หยุดชั่วคราว
  else { ctr.trun = 1; ctr.tend = Date.now() + s*1000; }                   // เริ่มเดิน
  saveCtr(); drawTimer();
}
function setTimer(min){
  ctr.tdur = min*60; ctr.tleft = ctr.tdur; ctr.trun = 0; ctr.tend = 0;
  saveCtr(); drawTimer(); closeTPick();
}
function resetTimer(){
  ctr.tleft = ctr.tdur; ctr.trun = 0; ctr.tend = 0;
  saveCtr(); drawTimer(); closeTPick();
}
function openTPick(){ document.getElementById('tpick').classList.add('show'); }
function closeTPick(){ document.getElementById('tpick').classList.remove('show'); }

/* สีพื้นหลังของแต่ละฝั่ง — ใช้โทนเข้มไล่เฉด ตัวเลข HP จะได้ยังอ่านชัด */
const SIDE_COLORS = [
  {k:'',       n:'ปกติ',   hex:'#39445c'},
  {k:'ฟ้า',     n:'ฟ้า',    hex:'#38bdf8'},
  {k:'เขียว',   n:'เขียว',  hex:'#22c55e'},
  {k:'ม่วง',    n:'ม่วง',   hex:'#a78bfa'},
  {k:'แดง',     n:'แดง',    hex:'#ef4444'},
  {k:'เหลือง',  n:'เหลือง', hex:'#facc15'},
  {k:'ดำ',      n:'ดำ',     hex:'#64748b'},
  {k:'ไร้สี',   n:'ไร้สี',  hex:'#cbd5e1'},
];
const sideDef = k => SIDE_COLORS.find(c => c.k === k) || SIDE_COLORS[0];
const hexRgb = hex => [1,3,5].map(i => parseInt(hex.substr(i,2),16)).join(',');
function buildPickers(){
  for(const p of [1,2]){
    document.getElementById('cpick'+p).innerHTML = SIDE_COLORS.map(c =>
      `<button class="csw" id="csw${p}_${c.k}" style="background:${c.hex}" title="${c.n}" onclick="setSideColor(${p},'${c.k}')"></button>`
    ).join('');
  }
}
function setSideColor(p,k){ ctr['col'+p] = k; saveCtr(); drawCtr(); closePick(); }
function togglePick(p){
  const box = document.getElementById('cpick'+p);
  const open = !box.classList.contains('show');
  closePick();
  if(open) box.classList.add('show');
}
function closePick(){ for(const p of [1,2]) document.getElementById('cpick'+p).classList.remove('show'); }
function saveCtr(){ try{ localStorage.setItem(LS_CTR, JSON.stringify(ctr)); }catch(e){} }
function drawCtr(){
  for(const p of [1,2]){
    const hpEl = document.getElementById('chp'+p);
    hpEl.textContent = ctr['hp'+p];
    hpEl.className = 'chp' + (ctr['hp'+p] <= 5 ? ' low' : '');
    document.getElementById('cmax'+p).textContent = ctr['max'+p];
    for(let i=0;i<3;i++){
      document.getElementById('cae'+p+'_'+i).className = 'cspark' + (ctr['ae'+p][i] ? ' lit' : '');
    }
    const isFirst = ctr.first === p;
    const nm = document.getElementById('cname'+p);
    nm.textContent = 'PLAYER ' + p + (isFirst ? ' • เริ่มก่อน' : '');
    nm.classList.toggle('first', isFirst);
    // ฝั่งที่เลือกสีเหลืองไว้ ไฮไลต์สีเหลืองจะกลืน เปลี่ยนเป็นขาวแทน
    nm.style.color = (isFirst && ctr['col'+p] === 'เหลือง') ? '#fff' : '';
    // พื้นหลังฝั่งนี้
    const panel = document.getElementById('cp'+p), key = ctr['col'+p];
    if(!key){ panel.style.backgroundImage = ''; }
    else{
      // ฝั่ง 2 ถูกหมุน 180 องศาอยู่ ใช้ 0deg เหมือนกันทั้งคู่ สีจึงเริ่มจากขอบนอกของจอทั้งสองฝั่ง
      const rgb = hexRgb(sideDef(key).hex);
      panel.style.backgroundImage = `linear-gradient(0deg, rgba(${rgb},.34), rgba(${rgb},.06) 58%, #0a0d13)`;
    }
    for(const c of SIDE_COLORS){
      const sw = document.getElementById('csw'+p+'_'+c.k);
      if(sw) sw.className = 'csw' + (c.k === key ? ' on' : '');
    }
  }
}
function chgHP(p,d){ ctr['hp'+p] = Math.max(0, Math.min(ctr['max'+p], ctr['hp'+p]+d)); saveCtr(); drawCtr(); }
function chgMax(p,d){
  ctr['max'+p] = Math.max(1, Math.min(99, ctr['max'+p]+d));
  if(ctr['hp'+p] > ctr['max'+p]) ctr['hp'+p] = ctr['max'+p];
  saveCtr(); drawCtr();
}
function toggleAE(p,i){ ctr['ae'+p][i] = ctr['ae'+p][i] ? 0 : 1; saveCtr(); drawCtr(); }
function resetHP(p){ ctr['hp'+p] = ctr['max'+p]; saveCtr(); drawCtr(); }
function resetAE(p){ ctr['ae'+p] = [1,1,1]; saveCtr(); drawCtr(); }
function resetGame(){
  if(!confirm('เริ่มเกมใหม่? (HP กลับเป็นค่า Max และอีเธอร์เต็ม)')) return;
  ctr.hp1 = ctr.max1; ctr.hp2 = ctr.max2; ctr.ae1 = [1,1,1]; ctr.ae2 = [1,1,1]; ctr.first = 0;
  ctr.tleft = ctr.tdur; ctr.trun = 0; ctr.tend = 0;
  const fb = document.getElementById('cfirstBtn'); if(fb) fb.classList.add('primary');
  saveCtr(); drawCtr();
}
function toggleFS(){
  if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  else { document.documentElement.requestFullscreen().catch(()=>{}); }
}
function toggleMid(){
  const actions = document.getElementById('cmidActions');
  const toggle = document.getElementById('cmidToggle');
  const open = actions.classList.toggle('open');
  toggle.classList.toggle('active', open);
  toggle.textContent = open ? '✕' : '⋮';
}
function closeMid(){
  document.getElementById('cmidActions').classList.remove('open');
  const toggle = document.getElementById('cmidToggle');
  toggle.classList.remove('active');
  toggle.textContent = '⋮';
}
document.addEventListener('click', (e) => {
  const cmid = document.getElementById('cmid');
  if(!cmid.contains(e.target)) closeMid();
  const inPick = e.target.closest && e.target.closest('.cpick, .cname');
  if(!inPick) closePick();
  const inT = e.target.closest && e.target.closest('.tpick, .cmidActions, .cmidToggle');
  if(!inT) closeTPick();
});
let firstTimer;
function pickFirst(){
  document.getElementById('cfirstBtn').classList.remove('primary');
  const msg = document.getElementById('cfirstMsg');
  let n = 0;
  clearInterval(firstTimer);
  msg.style.display = 'block';
  firstTimer = setInterval(() => {
    n++;
    msg.textContent = (n % 2 ? 'PLAYER 1' : 'PLAYER 2');
    msg.style.transform = 'translate(-50%,-50%)' + (n % 2 ? '' : ' rotate(180deg)');
    if(n > 14 + Math.floor(Math.random()*2)){
      clearInterval(firstTimer);
      const winner = (n % 2) ? 1 : 2, loser = winner === 1 ? 2 : 1;
      msg.textContent = '🎲 ' + msg.textContent + ' เริ่มก่อน!';
      ctr['ae'+winner] = [1,0,0];   // ผู้เริ่มก่อน = 1 อีเธอร์
      ctr['ae'+loser]  = [1,1,1];   // อีกฝ่าย = 3 อีเธอร์
      ctr.first = winner;
      saveCtr(); drawCtr();
      setTimeout(() => msg.style.display='none', 2600);
    }
  }, 120);
}
/* ---------- ล็อกความสูงหน้าจอ ----------
   บนแอปที่เปิดเต็มจอ พอแถบสถานะ/แถบนำทางโผล่ หน้าต่างจะถูกย่อจริง
   ทำให้ทุกอย่างที่คำนวณจากความสูงขยับตาม เห็นเป็นอาการกระตุก
   จึงจำความสูงมากสุดที่เคยเจอไว้ แล้วใช้ค่านั้นค้างไว้ ไม่ยอมหดตาม */
let appH = 0;
function lockHeight(){
  const h = window.innerHeight;
  if(h > appH + 1){
    appH = h;
    const r = document.documentElement.style;
    r.setProperty('--apph', appH + 'px');
    r.setProperty('--vhu', (appH/100) + 'px');
  }
}
lockHeight();
window.addEventListener('resize', lockHeight);
window.addEventListener('orientationchange', () => { appH = 0; setTimeout(lockHeight, 250); });

/* เปิดจากไอคอนแอปจะเต็มจออยู่แล้ว ปุ่ม ⛶ จึงไม่จำเป็นและทำให้ Android ขึ้นข้อความค้าง — ซ่อนทิ้ง */
function isInstalledApp(){
  try{
    return window.matchMedia('(display-mode: standalone)').matches
        || window.matchMedia('(display-mode: fullscreen)').matches
        || window.navigator.standalone === true;
  }catch(e){ return false; }
}
if(isInstalledApp()){
  const fsBtn = document.getElementById('cfsBtn');
  if(fsBtn) fsBtn.style.display = 'none';
}
/* ติดตั้งเป็นแอปและใช้งานออฟไลน์ (ต้องเปิดผ่าน https เช่น GitHub Pages) */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
/* กันจอดับระหว่างเล่น (ถ้าเบราว์เซอร์รองรับ) */
if('wakeLock' in navigator){
  const lock = () => navigator.wakeLock.request('screen').catch(()=>{});
  lock();
  document.addEventListener('visibilitychange', () => { if(!document.hidden) lock(); });
}
buildPickers();
drawCtr();
drawTimer();
setInterval(drawTimer, 250);
</script>
</body>
</html>
